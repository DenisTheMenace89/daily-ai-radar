name: Daily AI Radar Briefing

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/daily-briefing.yml"
      - "scripts/generate-ai-briefing.js"
  schedule:
    # GitHub cron uses UTC.
    # Summer time in Germany: 04:30 UTC = 06:30, 06:00 UTC = 08:00, 08:00 UTC = 10:00.
    # Multiple runs make the daily briefing more reliable if GitHub delays or skips one scheduled run.
    - cron: "30 4 * * *"
    - cron: "0 6 * * *"
    - cron: "0 8 * * *"

permissions:
  contents: write

jobs:
  update-briefing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate AI briefing
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.4-mini
        run: node scripts/generate-ai-briefing.js

      - name: Commit updated briefing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ -n "$(git status --porcelain)" ]]; then
            git add briefings.json
            git commit -m "Update daily AI briefing"
            git push
          else
            echo "No changes to commit"
          fi
